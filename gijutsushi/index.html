<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>技術士 勉強</title>
<meta name="theme-color" content="#f4f2ed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="技術士勉強">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="./hub.css">
</head>
<body>
<header class="app-header">
  <a class="back" href="../">← ツール一覧に戻る</a>
  <h1>技術士 勉強</h1>
  <p class="subtitle">第二次試験（機械部門・選択科目「機械設計」）の勉強入口</p>
</header>

<main>
  <a class="mode-card" href="./pakuringo/">
    <div class="mode-emoji">🦉</div>
    <div class="mode-body">
      <div class="mode-name">キーワード学習（パクリンゴ）</div>
      <div class="mode-desc">重要キーワード55語をレッスン形式で回す。穴埋め・対比・応用の6形式、XPと習熟度つき。</div>
      <div class="mode-stat" id="stat-paku">読み込み中…</div>
    </div>
    <div class="mode-arrow">›</div>
  </a>

  <a class="mode-card" href="./ronbun/">
    <div class="mode-emoji">✏️</div>
    <div class="mode-body">
      <div class="mode-name">論文骨子ドリル</div>
      <div class="mode-desc">過去問24問（令和4〜7年）で論文の骨子を作る練習。全問に回答例つき。</div>
      <div class="mode-stat" id="stat-ronbun">読み込み中…</div>
    </div>
    <div class="mode-arrow">›</div>
  </a>

  <p class="hint">記録はどちらもこの端末の中（localStorage）に保存されます。骨子の添削は、ドリル内の「添削用にコピー」で骨子をコピーして、Muse のチャットに貼ってください。</p>
</main>

<script>
(function () {
  function ls(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
  var p = ls('pakuringo:state');
  var el = document.getElementById('stat-paku');
  if (p && p.boxes) {
    var mastered = Object.keys(p.boxes).filter(function (k) { return p.boxes[k] >= 5; }).length;
    var seen = Object.keys(p.boxes).filter(function (k) { return p.boxes[k] > 0; }).length;
    el.textContent = 'XP ' + (p.xp || 0) + ' ／ 着手 ' + seen + '語 ／ 習熟 ' + mastered + '語（全55語）';
  } else {
    el.textContent = 'まだ記録がありません（スペース版の進捗は初回に引き継がれます）';
  }
  var o = ls('gijutsushi:outlines');
  document.getElementById('stat-ronbun').textContent =
    '保存した骨子 ' + (Array.isArray(o) ? o.length : 0) + '本';
})();
</script>
</body>
</html>
