<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイツール</title>
<meta name="theme-color" content="#f4f2ed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="マイツール">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="app-header">
  <h1>マイツール</h1>
  <p class="subtitle">自分のための小さなツール置き場</p>
</header>

<main>
  <div class="grid">
    <a class="tool-card" href="./workout/">
      <div class="tool-emoji">💪</div>
      <div class="tool-name">ワークアウトログ</div>
      <div class="tool-desc">自宅筋トレの記録。A/B/Cローテーション＋背中・脚・フットケア、週3回・30分。</div>
    </a>
    <!-- 新しいツールはここにカードとモジュールを追加する -->
  </div>
  <p class="hint">各ツールのデータは端末のブラウザ内に保存されます。バックアップは各ツールの設定画面からJSONで書き出してください。</p>
</main>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
